작ㅂ을 해줘# nginx/default.conf
upstream consumer_api {
    server web-consumer:8000;
}

upstream owner_api {
    server web-owner:8000;
}

upstream backoffice_api {
    server web-backoffice:8000;
}

upstream admin_api {
    server web-admin:8000;
}

server {
    listen 80 default_server;
    server_name _;

    # 정적 파일 서빙을 위한 location 추가
    location /static/ {
        root /app;
    }

    # 미디어 파일 서빙을 위한 location 추가
    location /media/ {
        alias /app/media/; # Django의 MEDIA_ROOT 경로를 지정
    }

    # Route consumer-related requests
    location /api/consumer/ {
        proxy_pass http://consumer_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route owner-related requests
    location /api/owner/ {
        proxy_pass http://owner_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route backoffice-related requests
    location /api/backoffice/ {
        proxy_pass http://backoffice_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://admin_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name customer-api.myapp.local;

    location /static/ {
        root /app;
        expires 1h;
        access_log off;
    }
    location /media/ {
        alias /app/media/;
        expires 1h;
        access_log off;
    }

    location / {
        proxy_pass http://consumer_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 웹소켓/HTTP1.1 대비
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

