# docker-compose.yml

services:
  # 소비자용 API 서비스
  web-consumer:
    build: .
    volumes:
      - .:/code
    environment:
      # Django가 consumer-api 프로젝트를 사용하도록 설정
      - DJANGO_SETTINGS_MODULE=consumer-api.settings
    command: gunicorn consumer-api.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      - db

  # 사장님용 API 서비스 추가
  web-owner:
    build: .
    volumes:
      - .:/code
    environment:
      # Django가 owner-api 프로젝트를 사용하도록 설정
      - DJANGO_SETTINGS_MODULE=owner-api.settings
    command: gunicorn owner-api.wsgi:application --bind 0.0.0.0:8000
    depends_on:
      - db

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    # Nginx가 두 백엔드 서비스 모두에 의존하도록 설정
    depends_on:
      - web-consumer
      - web-owner

volumes:
  postgres_data: